services:
  - type: web
    name: tidydata
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build:css
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: tidydata-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: AUTO_MIGRATE
        value: "true"
      - key: BILLING_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SINGLE_ID
        value: ""
      - key: STRIPE_PRICE_MONTHLY_ID
        value: ""
      - key: ENABLE_BILLING_SANDBOX
        value: "false"
      - key: FREE_TIER_MAX_ROWS
        value: "500"
      - key: FREE_TIER_MAX_FILE_MB
        value: "1"
      - key: PREMIUM_EXPORT_FORMATS
        value: "ndjson,tsv"
      - key: BULK_MAX_FILES
        value: "10"
      - key: HIGH_VOLUME_ROW_LIMIT
        value: "5000"
      - key: MAX_FILE_SIZE_MB
        value: "10"

databases:
  - name: tidydata-db
    plan: 0.1c-256mb
    databaseName: tidydata
    user: tidydata
    # Only allow connections from Render's private network. The web service
    # receives the internal connection string through DATABASE_URL above.
    ipAllowList: []
